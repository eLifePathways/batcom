# This file is meant for running a development environment locally.

services:
  app:
    build: .
    container_name: batcom
    ports:
      - ${PORT:-5120}:5120
    command: ["/bin/sh", "-c", "yarn db:push && yarn dev"]
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - NODE_TLS_REJECT_UNAUTHORIZED=0
      - POSTGRES_URL=${POSTGRES_URL:-}
      - POSTGRES_CA_CERT=${POSTGRES_CA_CERT:-}
      - PORT=${PORT:-5120}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      # Mount local source so edits hot-reload inside the container (HMR).
      - ./client:/app/client
      - ./server:/app/server
      - ./shared:/app/shared
      - ./vite.config.ts:/app/vite.config.ts
      - ./tailwind.config.ts:/app/tailwind.config.ts
      - ./postcss.config.js:/app/postcss.config.js
      - ./drizzle.config.ts:/app/drizzle.config.ts
      - ./tsconfig.json:/app/tsconfig.json
      # Keep the image's (amd64) node_modules — do not let the host shadow it.
      - /app/node_modules
    tty: true
    init: true
